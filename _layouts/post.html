---
layout: default
---
<div class="read-progress" aria-hidden="true"></div>
<article class="post">
    <header class="post-header">
        <p class="post-category">{{ page.category | replace: '-', ' ' }}</p>
        <h1>{{ page.title }}</h1>
        <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}{% if page.updated %} · Updated {{ page.updated | date: "%B %-d, %Y" }}{% endif %}</p>
    </header>

    <div class="post-body">
        {{ content }}
    </div>

    <footer class="post-footer">
        <a href="/">← All writing</a>
        <a href="mailto:aditya.sarangi65@gmail.com?subject=Reply to: {{ page.title | url_encode }}">Reply by email</a>
    </footer>
</article>
