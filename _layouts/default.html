<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css?v={{ site.time | date: '%s' }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><g transform=%22rotate(-90 50 50)%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%234A7C3A%22>%E0%AC%86</text></g></svg>">

    <title>{% if page.title %}{{ page.title }} — {% endif %}Aditya Sarangi</title>
    {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://adityasarangi.com{{ page.url }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}Aditya Sarangi">
    <meta property="og:image" content="https://adityasarangi.com/aditya-headshot.jpeg">
    <meta name="twitter:card" content="summary">

    <script>
        (function () {
            var savedTheme = localStorage.getItem('theme');
            var theme = savedTheme === 'dark' ? 'dark' : 'light';
            document.documentElement.dataset.theme = theme;
        }());
    </script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="site-name">Aditya Sarangi</a>
            <p class="site-tagline">Ideas, culture &amp; things that pull my attention.</p>
            <nav aria-label="Main navigation">
                <a href="/#writing"><span aria-hidden="true">✍️</span> Writing</a>
                <a href="/rabbit-holes.html"><span aria-hidden="true">🐇</span> Rabbit holes</a>
                <a href="/music.html"><span aria-hidden="true">🎵</span> Music</a>
                <a href="/collections.html"><span aria-hidden="true">🪨</span> Collections</a>
                <a href="/#about"><span aria-hidden="true">🌱</span> About</a>
                <a href="mailto:aditya.sarangi65@gmail.com"><span aria-hidden="true">📮</span> Email</a>
                <a href="https://x.com/AdityaSara45596"><span aria-hidden="true">🐦</span> Twitter</a>
                <a href="https://www.linkedin.com/in/sarangii/"><span aria-hidden="true">🤓</span> LinkedIn</a>
            </nav>
            <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode"><span class="theme-toggle-label">Light</span> ↗</button>
        </div>
    </header>
    <main class="content" id="main">
        {{ content }}
    </main>

    <script>
        (function () {
            var toggle = document.querySelector('.theme-toggle');
            if (!toggle) return;

            function updateToggle() {
                var isDark = document.documentElement.dataset.theme === 'dark';
                toggle.setAttribute('aria-pressed', String(isDark));
                toggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
                toggle.classList.toggle('is-on', isDark);
                toggle.querySelector('.theme-toggle-label').textContent = isDark ? 'Dark' : 'Light';
            }

            toggle.addEventListener('click', function () {
                var isDark = document.documentElement.dataset.theme === 'dark';
                if (isDark) {
                    document.documentElement.dataset.theme = 'light';
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.dataset.theme = 'dark';
                    localStorage.setItem('theme', 'dark');
                }
                updateToggle();
            });

            updateToggle();
        }());
    </script>
</body>
</html>
