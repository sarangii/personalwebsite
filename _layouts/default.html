<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css?v={{ site.time | date: '%s' }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><g transform=%22rotate(-90 50 50)%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%234A7C3A%22>%E0%AC%86</text></g></svg>">

    <title>{% if page.title %}{{ page.title }} — {% endif %}Aditya Sarangi</title>
    {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://adityasarangi.com{{ page.url }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}Aditya Sarangi">
    <meta property="og:image" content="https://adityasarangi.com/aditya-headshot.jpeg">
    <meta name="twitter:card" content="summary">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N1YFKE5YHG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-N1YFKE5YHG');
    </script>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="site-name">Aditya Sarangi</a>
            <nav aria-label="Main navigation">
                <a href="/#writing">Writing</a>
                <a href="/#about">About</a>
            </nav>
        </div>
    </header>
    <main class="content">
        {{ content }}
    </main>

    {% assign peek_post = site.posts.first %}
    {% if peek_post %}
    <aside class="peek" id="peek" aria-hidden="true">
        <a class="peek-link" href="{{ peek_post.url }}" tabindex="-1">
            <span class="peek-bubble"><small>read</small>{{ peek_post.title }}</span>
            <svg class="peek-art" id="peek-art" viewBox="0 0 16 15" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
        </a>
        <button class="peek-close" type="button" aria-label="Dismiss">×</button>
    </aside>
    {% endif %}
    <script src="/assets/js/site.js?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
