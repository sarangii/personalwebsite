<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <pattern id="wave-hatch" width="6" height="6" patternTransform="rotate(35)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#eae4db" stroke-width="1" stroke-opacity="0.32"/>
    </pattern>
  </defs>
  <!-- Acoustic axis & Vernier ticks -->
  <g stroke="#eae4db" stroke-opacity="0.3" stroke-width="1" fill="none">
    <line x1="0" y1="175" x2="800" y2="175" stroke-dasharray="6 4"/>
    <line x1="560" y1="0" x2="560" y2="350" stroke-dasharray="6 4"/>
  </g>
  <!-- Concentric harmonic resonance plate -->
  <g transform="translate(560 175)">
    <circle r="128" fill="#243159" fill-opacity="0.35" stroke="#eae4db" stroke-width="1.4"/>
    <circle r="96" fill="url(#wave-hatch)" stroke="#eae4db" stroke-width="1.1"/>
    <circle r="64" fill="#243159" fill-opacity="0.55" stroke="#eae4db" stroke-width="1.2"/>
    <circle r="32" fill="#eae4db" fill-opacity="0.82"/>
    <path d="M-128 0 H128 M0 -128 V128" stroke="#eae4db" stroke-width="0.9" stroke-opacity="0.65"/>
  </g>
  <!-- Harmonic wave interference curves -->
  <g fill="none" stroke="#eae4db" stroke-width="1.45" stroke-opacity="0.9">
    <path d="M40 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130"/>
    <path d="M80 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130"/>
    <path d="M120 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130"/>
    <path d="M160 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130"/>
    <path d="M200 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130"/>
    <path d="M240 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130"/>
    <path d="M280 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130"/>
    <path d="M320 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130"/>
    <path d="M360 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130"/>
    <path d="M400 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130"/>
    <path d="M440 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130"/>
    <path d="M480 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130"/>
    <path d="M520 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130" stroke-opacity="0.55"/>
    <path d="M560 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130" stroke-opacity="0.45"/>
    <path d="M600 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130" stroke-opacity="0.45"/>
    <path d="M640 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130" stroke-opacity="0.55"/>
    <path d="M680 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130" stroke-opacity="0.7"/>
    <path d="M720 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130" stroke-opacity="0.8"/>
    <path d="M760 -20q-80 65 0 130q-80 65 0 130q-80 65 0 130" stroke-opacity="0.85"/>
  </g>
  <text x="235" y="328" text-anchor="middle" fill="#eae4db" font-family="Georgia, serif" font-style="italic" font-size="13" opacity="0.88">Fig. B — Harmonic Standing Field</text>
</svg>
