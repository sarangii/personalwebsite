name: Build and deploy personal website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          future: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the transformer studio
        working-directory: nordic-transfer-studio
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run build:static
      - name: Add the studio to the published site
        run: cp -R nordic-transfer-studio/dist _site/nordic-transfer-studio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
